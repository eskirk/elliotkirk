name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Hard gate: the build must type-check, lint and compile before anything is
  # deployed. Runs on pull requests and on pushes to main.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

  # Production deploy, only on direct pushes to main and only once checks pass.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy elliotkirk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{secrets.SSH_USERNAME}}
          passphrase: ${{secrets.SSH_PASSPHRASE}}

          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd elliotkirk
            nvm install 24
            nvm use 24
            corepack enable
            set -e
            GIT_SSH_COMMAND="ssh -i /home/steve/.ssh/elliotkirk_deploy -o IdentitiesOnly=yes" git fetch origin main
            git reset --hard FETCH_HEAD
            yarn
            yarn build
            echo "Deployed elliotkirk"
