name: Deploy dev
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # Same hard gate as main: type-check, lint and compile before deploying.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

  # Dev deploy, only on direct pushes to dev and only once checks pass.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy elliotkirkdev
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.SSH_HOST}}
          key: ${{secrets.SSH_KEY}}
          username: ${{secrets.SSH_USERNAME}}
          passphrase: ${{secrets.SSH_PASSPHRASE}}

          script: |
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd elliotkirkdev
            nvm install 24
            nvm use 24
            corepack enable
            set -e
            git checkout -f dev
            git pull -f origin dev
            yarn
            yarn build
            echo "Deployed elliotkirkdev"
